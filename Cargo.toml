[package]
name = "ordex-network-boids"
version = "0.1.0"
edition = "2021"
authors = ["Rhetro <rhetro@rhetroxc.com>"]
description = "Non-Linear Network Boids Simulation using Ordex (v0.2.0) and WebAssembly."
repository = "https://github.com/rhetro/ordex-network-boids"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"

rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }
ordex = "0.2.0"

[dependencies.web-sys]
version = "0.3.72"
features =[
  "CanvasRenderingContext2d",
  "Window",
  "Document",
  "HtmlCanvasElement",
  "Element",
]
